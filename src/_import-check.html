<!DOCTYPE html>
<!--
  Wonder Lab Studio — does the guide actually SHOW where the elephant is?

  A lesson's first steps say "press the plus, the library opens, pick the elephant" — and until now
  the demonstration imported the actors behind the student's back: the words pointed at nothing, and
  the thing being taught (which button, which tile, how far down) was the one thing not shown.

  So the driver now walks the picker: press the plus, wait for the library, scroll to the tile, ring
  it, press it. This page runs that on the real page, with the real lesson data, and checks the four
  visible facts along the way:

    1. something lit the plus button while the library was still closed — the step's own mark, or
       the picker's own ring, whichever the step asked for
    2. the library opened
    3. a ring appeared on a tile inside the library
    4. every actor the step names is on the stage afterwards, under the lesson's own name
    5. a hand travelled to each target and pressed it, once per press, with a click each time

  plus the same for a backdrop, whose picker is a different button and a different list.

  Run it:
      WL_LIBRARY=<lab-library> python3 server/studio_server.py --port 8920
      npm run check:pages
  Read #wl-import-out; the last line is RESULT PASS or RESULT FAIL.

  Copyright (C) 2026 IITS (工信學堂（香港）). Licensed under the GNU Affero General Public License v3.0 only.
-->
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>import check</title>
<style>html,body{margin:0}iframe{width:100%;height:78vh;border:0}pre{margin:0;padding:8px;font:12px/1.5 monospace;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="app" src="index.html"></iframe>
<pre id="wl-import-out">START</pre>
<script>
(function () {
  'use strict';
  var out = document.getElementById('wl-import-out');
  function log(s) { out.textContent += '\n' + s; }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function frame() { return document.getElementById('app'); }
  function win() { return frame().contentWindow; }
  function doc() { return frame().contentDocument; }

  /* `stray` is the failure this page was extended for: a frame that outlives the dialog it was drawn
     inside. The picker closes on the click, so a highlight still on screen one sample after the close
     is ringing whatever now occupies those coordinates — the editor, not the elephant. */
  var seen = { plus: 0, tile: 0, picker: 0, hand: 0, ripple: 0, stray: 0 };
  var wasOpen = false;
  /** While a step runs, remember every ring that appears and whether the library was open then. */
  function sample() {
    var open = doc().querySelectorAll('[class*="library-item_library-item"]').length > 0;
    var rings = doc().querySelectorAll('.wl-point').length;
    /* A step that already rings the button with its own mark passes `ring: false`, so "did it point
       at the plus" is the union of the two layers — and the count of rings after a close is a
       question of its own (`stray`), never evidence that the plus was pointed at. */
    var lit = rings || doc().querySelectorAll('.wl-mark.is-on').length;
    if (open) seen.picker++;
    if (rings && open) seen.tile++;
    if (lit && !open) seen.plus++;
    if (wasOpen && !open && rings) seen.stray++;
    wasOpen = open;
    if (doc().querySelectorAll('.wl-cur.is-on').length) seen.hand++;
    if (doc().querySelectorAll('.wl-ripple.is-go').length) seen.ripple++;
  }
  function watch(untilDone) {
    var timer = setInterval(sample, 120);
    return untilDone.then(function (v) { clearInterval(timer); return v; },
      function (e) { clearInterval(timer); throw e; });
  }

  function names() {
    var vm = win().WLStudio.vm;
    return vm.runtime.targets.map(function (t) { return t.getName(); });
  }

  var tries = 0;
  (function boot() {
    tries++;
    var w = win(), S = w && w.WLStudio;
    var loading = S && typeof S.isLoading === 'function' ? S.isLoading() : false;
    if (!S || !S.vm || !S.vm.runtime.targets.length || loading || !w.StudioGuideDrive) {
      if (tries < 60) return setTimeout(boot, 500);
      log('RESULT FAIL: the editor never booted');
      return;
    }

    var topics = (w.StudioGuideLessons || []);
    var topic = topics.filter(function (t) { return t.id === '501-bp01'; })[0];
    if (!topic || !topic.steps || topic.steps.length < 3) {
      log('RESULT FAIL: 501-bp01 is not in the guide data');
      return;
    }
    var drive = w.StudioGuideDrive.create({ i18n: w.StudioI18n });
    /* the driver reports what went wrong to the console, and a headless run has no console */
    ['warn', 'info', 'log'].forEach(function (k) {
      var orig = w.console[k];
      w.console[k] = function () {
        var line = [].slice.call(arguments).map(function (a) { return String(a && a.message || a); }).join(' ');
        if (/guide|picker|add/i.test(line)) log('  [console.' + k + '] ' + line);
        try { orig.apply(w.console, arguments); } catch (e) {}
      };
    });
    log('isLoading=' + (typeof w.WLStudio.isLoading === 'function' ? w.WLStudio.isLoading() : 'n/a'));
    var byId = function (id) { return topic.steps.filter(function (s) { return s.id === id; })[0]; };
    var importStep = byId('p1');
    var backdropStep = byId('p2');
    var actors = (importStep.demo.add || []).map(function (o) { return o.name; });
    var backdrop = (backdropStep.demo.add || [])[0].name;
    log('step 1 imports: ' + actors.join(', ') + '   step 2 backdrop: ' + backdrop);

    watch(drive.run(importStep, null, topic)).then(function (ok) {
      var hand = drive.cursor().state();
      log('step 1 finished: ' + ok + '   targets now: ' + names().join(', '));
      log('  plus lit while the library was closed in ' + seen.plus + ' samples, ringed inside the' +
          ' library in ' + seen.tile + ', library open samples: ' + seen.picker);
      log('  hand: travels ' + hand.travels + ', presses ' + hand.presses +
          ', clicks heard ' + hand.sounds + ', on screen in ' + seen.hand + ' samples' +
          ', ripples seen ' + seen.ripple);
      log('  frames left after a dialog closed: ' + seen.stray + (seen.stray ? ' — LEFT BEHIND' : ' — none'));
      log('  library closed afterwards: ' + (doc().querySelectorAll('[class*="library-item_library-item"]').length === 0));

      var withAlias = actors.map(function (n) {
        var add = (importStep.demo.add || []).filter(function (o) { return o.name === n; })[0];
        var ref = add && add.sprite ? String(add.sprite).replace('@', '') : null;
        var key = 'guide.sprite.' + ref;
        var alias = ref ? w.StudioI18n.t(key) : n;
        return alias === key ? n : alias;
      });
      var absent = withAlias.filter(function (a) { return names().indexOf(a) < 0; });
      log('  expected on stage: ' + withAlias.join(', '));
      log(absent.length ? '  MISSING: ' + absent.join(', ') : '  all actors present under the lesson\'s names');

      seen.plus = 0; seen.tile = 0; seen.picker = 0; seen.hand = 0; seen.stray = 0;
      return watch(drive.run(backdropStep, null, topic)).then(function (ok2) {
        var stage = w.WLStudio.vm.runtime.targets[0];
        var costumes = (stage.getCostumes() || []).map(function (c) { return c.name; });
        var showing = costumes[stage.currentCostume];
        var hand2 = drive.cursor().state();
        log('step 2 finished: ' + ok2 + '   backdrop button lit while closed in ' + seen.plus +
            ' samples, ringed in the backdrop library in ' + seen.tile);
        log('  backdrops now: ' + costumes.join(', ') + '   showing: ' + showing);
        log('  hand total: travels ' + hand2.travels + ', presses ' + hand2.presses +
            ', clicks heard ' + hand2.sounds + ', on screen in ' + seen.hand + ' samples' +
            ', ripples seen ' + seen.ripple);
        log('  frames left after a dialog closed: ' + seen.stray + (seen.stray ? ' — LEFT BEHIND' : ' — none'));

        /* Two presses per item — the plus, then the tile — and a click for each. The sounds are
           counted, not heard: a headless browser has no speakers, and a silent regression is exactly
           the kind of thing no screenshot would ever show. The ripple is checked the same way, for
           the same reason: a 460ms animation is uncatchable in a still. */
        var presses = hand2.presses, expected = (actors.length + 1) * 2;
        var handOk = presses >= expected && hand2.travels >= expected &&
                     hand2.sounds === presses && seen.ripple > 0;
        log('  hand pressed ' + presses + ' times, expected at least ' + expected +
            (handOk ? ' — ok' : ' — WRONG'));

        /* The click, rendered offline and measured: a headless browser has no speakers, and a click
           that makes no sound is precisely the bug a screenshot cannot show. */
        return drive.cursor().probe().then(function (p) {
          var audible = !!p && p.peak > 0.05;
          log('  click waveform: ' + (p ? 'peak ' + p.peak + ' over ' + p.ms + 'ms' : 'could not render') +
              (audible ? ' — audible' : ' — SILENT'));
          var okAll = absent.length === 0 &&
                      seen.plus > 0 && seen.tile > 0 && seen.picker > 0 &&
                      seen.stray === 0 &&
                      costumes.indexOf(backdrop) >= 0 && showing === backdrop &&
                      handOk && audible;
          log(okAll ? 'RESULT PASS' : 'RESULT FAIL');
        });
      });
    }).then(null, function (e) {
      log('RESULT FAIL threw: ' + (e && e.message));
    });
  }());
}());
</script>
</body>
</html>
