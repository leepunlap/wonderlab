<!DOCTYPE html>
<!--
  Wonder Lab Studio — does every 「匯入」 the guide asks for actually land on the stage?

  A lesson's first steps are the ones no lesson material ever writes down: an empty stage, the actors
  brought in, a background put behind them. They are data (studio-guide-lessons.js,
  studio-guide-refs.js) plus a driver (studio-guide-drive.js), and a wrong sprite or backdrop name in
  that data looks exactly like a working feature until somebody presses the button - because
  `addThings` only warns when an import fails. So this page walks the real data, imports every single
  thing it names, and checks that each one arrived.

  It reads the lists out of the iframe's own window, so a name added to a lesson is covered without
  anybody editing this file, and it loads index.html rather than copying it so the page under test is
  the page the students get.

  Run it:
      WL_LIBRARY=<lab-library> python3 server/studio_server.py --port 8920   (the library 404s without it)
      "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu \
          --virtual-time-budget=300000 --dump-dom http://127.0.0.1:8920/_drive-check.html
  or just `npm run check:pages`. Read #wl-drive-out; the last line is RESULT PASS or RESULT FAIL.

  Copyright (C) 2026 IITS (工信學堂（香港）). Licensed under the GNU Affero General Public License v3.0 only.
-->
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>drive check</title>
<style>html,body{margin:0}iframe{width:100%;height:80vh;border:0}pre{margin:0;padding:8px;font:13px/1.5 monospace}</style>
</head>
<body>
<iframe id="app" src="index.html"></iframe>
<pre id="wl-drive-out">START</pre>
<script>
(function () {
  'use strict';
  var out = document.getElementById('wl-drive-out');
  function log(s) { out.textContent += '\n' + s; }

  /** Every distinct thing the guide's data asks the library for, in the order it asks for it. */
  function plan(win) {
    var seen = {}, adds = [];
    ((win.StudioGuideLessons || []).concat(win.StudioGuideRefs || [])).forEach(function (t) {
      (t.steps || []).forEach(function (st) {
        (((st && st.demo) || {}).add || []).forEach(function (o) {
          var key = o['do'] + ':' + o.name;
          if (seen[key]) return;
          seen[key] = 1;
          /* '@mouse' is the driver's reference, not a name; 'T-' stands in for whatever the locale
             resolves it to, because resolving it is the driver's job, not this page's. */
          adds.push({ 'do': o['do'], name: o.name, alias: 'T-' + String(o.sprite || o.name).replace('@', '') });
        });
      });
    });
    return adds;
  }

  var tries = 0;
  (function tick() {
    tries++;
    var win = document.getElementById('app').contentWindow;
    var S = win && win.WLStudio, vm = S && S.vm;
    if (!vm || !vm.runtime || !vm.runtime.targets.length) {
      if (tries < 60) return setTimeout(tick, 500);
      log('RESULT FAIL: the editor never booted');
      return;
    }
    if (!win.StudioGuideLessons) {
      log('RESULT FAIL: the lesson data did not load');
      return;
    }

    var adds = plan(win);
    log(adds.length + ' things the guide asks the library for');

    var bad = [];
    var p = Promise.resolve();
    adds.forEach(function (o) {
      p = p.then(function () {
        return o['do'] === 'add_sprite' ? S.addLibrarySprite(o.name, o.alias) : S.addLibraryBackdrop(o.name);
      }).then(function () {
        /* vm.addSprite / vm.addBackdrop resolve with nothing, so success can only be read off the
           stage: the target has to be there afterwards. */
        var stage = vm.runtime.targets[0];
        var got = o['do'] === 'add_sprite'
          ? vm.runtime.targets.some(function (t) { return t.getName() === o.alias; })
          : stage.getCostumes().some(function (c) { return c.name === o.name; });
        if (!got) { bad.push(o['do'] + ' ' + o.name); log('  MISSING ' + o['do'] + ' ' + o.name); }
      }, function (e) {
        bad.push(o['do'] + ' ' + o.name);
        log('  ERROR ' + o['do'] + ' ' + o.name + ': ' + (e && e.message));
      });
    });

    p.then(function () {
      log(bad.length ? bad.length + ' of ' + adds.length + ' did not arrive' : 'all ' + adds.length + ' arrived');
      log(bad.length ? 'RESULT FAIL' : 'RESULT PASS');
    }, function (e) { log('RESULT FAIL ' + (e && e.message)); });
  })();
}());
</script>
</body>
</html>
