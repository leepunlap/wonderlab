<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wonder Lab 積木編輯器</title>
<link rel="stylesheet" href="studio-lab.css">
</head>
<body>
<!-- Wonder Lab Studio inside an L4 lesson page (lab.js creates this frame). Copyright (C) 2026 IITS. AGPL-3.0-only. -->
<main id="wl-editor" aria-label="積木編輯器"></main>

<div class="wl-lockpane" id="wl-lock-a" hidden>
  <div class="wl-lockmsg" id="wl-lockmsg" role="status" hidden>
    <span class="wl-spin" aria-hidden="true"></span><span id="wl-locktext">AI 正在改積木…</span>
  </div>
</div>
<div class="wl-lockpane" id="wl-lock-b" hidden></div>

<div class="wl-tools" id="wl-tools" role="toolbar" aria-label="Wonder Lab">
  <button type="button" id="wl-tool-undo" title="回到 AI 上一次改動之前的程式" disabled>
    <svg class="ic" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
    <span>上一步</span></button>
  <button type="button" id="wl-tool-export" class="wl-soon" aria-disabled="true" title="匯出 .sb3 coming soon：與 UCMake 的檔案格式相容性仍待官方格式規範。"
          data-note="匯出 .sb3 coming soon：與 UCMake 的檔案格式相容性仍待官方格式規範。">
    <svg class="ic" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>
    <span>Export sb3</span><small>coming soon</small></button>
  <button type="button" id="wl-tool-chat" class="wl-chatbtn" hidden>
    <svg class="ic" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
    <span>AI 學伴</span></button>
</div>
<p class="wl-toolnote" id="wl-toolnote" role="status" hidden></p>

<script src="scratch-gui-standalone.js"></script>
<script src="studio-core.js"></script>
<script src="studio-ops.js"></script>
<script src="studio-trace.js"></script>
<!--wl-anim-->
<script src="ucmake-blocks.js"></script>
<script src="studio-assist.js"></script>
<script src="studio-app.js"></script>
<script src="lesson-page.js"></script>
<script src="lesson-frame.js"></script>
<script>
/* The lesson page's binder. lab-frame used to load studio-lab.js - 1,093 lines that were half editor
   and half lesson page. The editor is studio-app.js, the lesson model is lesson-page.js, and the
   lesson's own UI is lesson-frame.js. This block only wires the page to the parent frame. */
(function () {
  'use strict';
  var F = LessonFrame.create({
    locale: 'zh-tw',
    chat: true,
    onChat: function (S) { try { parent.postMessage({ wl: 'chat' }, '*'); } catch (e) {} }
  });
  // the parent (lab.js) calls WLStudio.boot(lesson) across the frame; keep that entry point
  window.WLStudio = F.shell();
  window.WLStudio.boot = function (c) { return F.boot(c); };
  window.WLStudio.toast = F.toast;
  window.WLStudio.lock = F.lock;
  window.WLStudio.isLocked = F.isLocked;
  window.WLStudio.toolNote = F.toolNote;
  window.WLStudio.setTools = F.setTools;
}());
</script>
</body>
</html>
